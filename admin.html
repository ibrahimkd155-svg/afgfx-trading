<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFGFX Admin</title><link rel="stylesheet" href="content-style.css"></head>
<body><header><a class="brand" href="index.html"><img src="logo.jpeg" alt="AFGFX logo">AFG<span>FX</span></a><nav><a href="index.html">Homepage</a><a href="analysis.html">Analysis</a></nav></header>
<main class="wrap"><span class="eyebrow">PRIVATE CONTENT MANAGEMENT</span><h1>AFGFX <em>Admin</em></h1><p class="lead">Sign in with the admin email you created in Supabase. Only an approved user in <code>admin_users</code> can manage posts.</p>
<section class="panel" id="authPanel"><h2>Sign in</h2><label>Email<input class="field" id="email" type="email" autocomplete="username"></label><label>Password<input class="field" id="password" type="password" autocomplete="current-password"></label><button id="login">Sign in</button><p class="status" id="authStatus"></p></section>
<section class="panel hidden" id="editorPanel"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center"><h2>New post</h2><button id="logout" type="button">Sign out</button></div>
<label>Title<input class="field" id="title" maxlength="180"></label><label>Category<select class="field" id="category"><option value="analysis">Market Analysis</option><option value="education">Trading Education</option><option value="insights">Market Insights</option><option value="community">Trading Community</option></select></label>
<label>Content<textarea class="field" id="body" rows="7"></textarea></label><label>Optional image<input class="field" id="image" type="file" accept="image/*"></label>
<label>Status<select class="field" id="status"><option value="draft">Save as draft</option><option value="published">Publish now</option></select></label><button id="save">Save post</button><p class="status" id="saveStatus"></p><h2>Your recent posts</h2><div id="myPosts"></div></section></main>
<footer>Keep your Supabase secret/service-role key out of this website.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
let sb;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){if(!window.supabase||!window.AFGFX_SUPABASE_URL||!window.AFGFX_SUPABASE_PUBLISHABLE_KEY){$("authStatus").textContent="Supabase configuration is missing.";return;}sb=window.supabase.createClient(window.AFGFX_SUPABASE_URL,window.AFGFX_SUPABASE_PUBLISHABLE_KEY);const {data}=await sb.auth.getSession();if(data.session) await checkAdmin();}
async function checkAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data,error}=await sb.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();if(error||!data){$("authStatus").textContent="This account is not approved as an AFGFX admin.";await sb.auth.signOut();return;} $("authPanel").classList.add("hidden");$("editorPanel").classList.remove("hidden");loadMyPosts();}
$("login").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("authStatus").textContent=error?error.message:"Signed in.";if(!error)await checkAdmin();};
$("logout").onclick=async()=>{await sb.auth.signOut();$("editorPanel").classList.add("hidden");$("authPanel").classList.remove("hidden");};
async function loadMyPosts(){const {data,error}=await sb.from("posts").select("*").order("created_at",{ascending:false}).limit(30);$("myPosts").innerHTML=error?'<p class="muted">Could not load posts.</p>':(data||[]).map(p=>`<article class="post"><span class="tag">${esc(p.status)} · ${esc(p.category)}</span><h3>${esc(p.title)}</h3><p class="muted">${esc(p.created_at||"")}</p><button data-delete="${esc(p.id)}" type="button">Delete</button></article>`).join("")||'<p class="muted">No posts yet.</p>';document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this post?"))return;const {error}=await sb.from("posts").delete().eq("id",b.dataset.delete);$("saveStatus").textContent=error?error.message:"Post deleted.";loadMyPosts();});}
$("save").onclick=async()=>{const title=$("title").value.trim(),body=$("body").value.trim();if(!title){$("saveStatus").textContent="Please enter a title.";return;} $("saveStatus").textContent="Saving…";let image_url=null;const file=$("image").files[0];if(file){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const path=Date.now()+"-"+safe;const {error:upErr}=await sb.storage.from("afgfx-content").upload(path,file,{upsert:false});if(upErr){$("saveStatus").textContent="Image upload failed: "+upErr.message;return;}image_url=sb.storage.from("afgfx-content").getPublicUrl(path).data.publicUrl;}
const {error}=await sb.from("posts").insert({title,body,category:$("category").value,status:$("status").value,image_url});$("saveStatus").textContent=error?("Save failed: "+error.message):"Post saved.";if(!error){$("title").value="";$("body").value="";$("image").value="";loadMyPosts();}};
init();
</script></body></html>
